<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UA Schedule Importer</title>
<meta name="theme-color" content="#0b3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UA Schedule">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<style>
  :root {
    --blue: #0b3d91;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #d9e0ea;
    --text: #1b2430;
    --muted: #6b7686;
    --warn-bg: #fff4e5;
    --warn-text: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141c;
      --card: #1a2130;
      --border: #2b3648;
      --text: #e7ecf3;
      --muted: #9aa5b5;
      --warn-bg: #3a2e10;
      --warn-text: #f0c060;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    padding: 16px; padding-bottom: 48px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0 0 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 14px;
  }
  .drop-zone {
    border: 2px dashed var(--border); border-radius: 12px; padding: 28px 16px;
    text-align: center; cursor: pointer; color: var(--muted);
  }
  .drop-zone.drag { border-color: var(--blue); color: var(--blue); }
  .drop-zone strong { color: var(--text); }
  input[type=file] { display: none; }
  .status { margin-top: 10px; font-size: 0.9rem; color: var(--muted); min-height: 1.2em; }
  .status.error { color: #c0392b; }
  .badge { display: inline-block; font-size: 0.78rem; padding: 3px 8px; border-radius: 999px; margin-top: 8px; }
  .badge.ok { background: #e4f7ea; color: #1a7a3d; }
  .badge.warn { background: var(--warn-bg); color: var(--warn-text); }
  .settings-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 3px; }
  input[type=text] {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: 0.95rem;
  }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  #results[hidden], #assumptionsSection[hidden], #unparsedSection[hidden], #debugSection[hidden] { display: none; }
  #summary { font-size: 0.9rem; margin-bottom: 10px; color: var(--muted); }
  ul { padding-left: 18px; margin: 0; }
  #eventList { list-style: none; padding: 0; margin: 0; }
  #eventList li { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
  #eventList li:last-child { border-bottom: none; }
  .meta { color: var(--muted); font-size: 0.82rem; }
  #assumptions li, #unparsed li { font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  button {
    background: var(--blue); color: white; border: none; border-radius: 10px;
    padding: 12px 16px; font-size: 1rem; font-weight: 600; width: 100%; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .link-btn {
    background: none; border: none; color: var(--blue); font-weight: 500; font-size: 0.85rem;
    padding: 6px 0; width: auto; text-decoration: underline;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 8px; }
  th, td { border: 1px solid var(--border); padding: 4px 6px; text-align: left; vertical-align: top; }
  th { background: rgba(11,61,145,0.08); }
</style>
</head>
<body>
  <h1>UA Schedule Importer</h1>
  <p class="subtitle">Upload your monthly schedule PDF, review the parsed events, then download a calendar file to import.</p>

  <div class="card">
    <div id="dropZone" class="drop-zone">
      <strong>Tap to choose a PDF</strong><br>or drag one here
    </div>
    <input type="file" id="fileInput" accept="application/pdf">
    <div id="status" class="status"></div>
    <div id="persistBadge" class="badge"></div>
  </div>

  <div id="results" class="card" hidden>
    <h2>Parsed schedule</h2>
    <div id="summary"></div>
    <ul id="eventList"></ul>

    <div id="assumptionsSection" hidden style="margin-top:14px;">
      <h2>Assumptions made</h2>
      <ul id="assumptions"></ul>
    </div>

    <div id="unparsedSection" hidden style="margin-top:14px;">
      <h2>Skipped / unparsed rows</h2>
      <ul id="unparsed"></ul>
    </div>

    <button id="debugToggle" class="link-btn" type="button">Show raw extracted rows</button>
    <div id="debugSection" hidden>
      <table id="debugTable"></table>
    </div>
  </div>

  <div class="card">
    <button id="downloadBtn" disabled>Download calendar file (.ics)</button>
  </div>

  <div class="card">
    <h2>Settings</h2>
    <div class="settings-grid">
      <div>
        <label for="employeeId">Your employee ID (excluded from student lists)</label>
        <input type="text" id="employeeId">
      </div>
      <div>
        <label for="calendarName">Calendar name hint</label>
        <input type="text" id="calendarName">
      </div>
      <div>
        <label for="stationSuffix">Base station suffix (used in event IDs)</label>
        <input type="text" id="stationSuffix">
      </div>
    </div>
  </div>

  <script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.worker.min.mjs';
    window.pdfjsLib = pdfjsLib;
    window.dispatchEvent(new Event('pdfjs-ready'));
  </script>
  <script src="./js/pdfExtractor.js"></script>
  <script src="./js/scheduleParser.js"></script>
  <script src="./js/ics.js"></script>
  <script>
    // app.js references window.pdfjsLib; wait for the module script above to
    // set it (module scripts execute after classic scripts, and are async,
    // so this ordering matters) before wiring up file handling.
    function boot() {
      const s = document.createElement('script');
      s.src = './js/app.js';
      document.body.appendChild(s);
    }
    if (window.pdfjsLib) boot();
    else window.addEventListener('pdfjs-ready', boot, { once: true });
  </script>
</body>
</html>
